version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 ecommerce.asgi:application"
    environment:
      DEBUG: "True"
      DATABASE_URL: postgresql://ecommerce_user:ecommerce_password@db:5432/ecommerce
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery:
    build: .
    command: celery -A ecommerce worker -l info
    environment:
      DEBUG: "True"
      DATABASE_URL: postgresql://ecommerce_user:ecommerce_password@db:5432/ecommerce
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    command: celery -A ecommerce beat -l info
    environment:
      DEBUG: "True"
      DATABASE_URL: postgresql://ecommerce_user:ecommerce_password@db:5432/ecommerce
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
